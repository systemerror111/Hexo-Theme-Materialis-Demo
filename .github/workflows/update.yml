name: Update Theme

on:
  workflow_dispatch: 

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blog Source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_TOKEN }} 
          submodules: true

      - name: Update Theme Submodule
        run: |
          git config --global user.name "systemerror111"
          git config --global user.email "zhuguojin4@gmail.com"
          
          cd themes/Materialis
          
          # 先获取所有远程分支
          git fetch --all
          
          # 直接切换到远程的 feature/v4 分支
          git checkout -b feature/v4 origin/feature/v4
          
          # 拉取最新代码
          git pull origin feature/v4
          
          cd ../..
          git add themes/Materialis
          git commit -m "chore: Auto-update theme to feature/v4" || echo "No changes to commit"
          git push origin main